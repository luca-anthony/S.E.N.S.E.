[env:pico]
platform = raspberrypi
board = pico
framework = arduino
lib_deps = 
	adafruit/Adafruit_VL53L0X@^1.2.5
	pololu/VL53L1X@^1.3.1
	vshymanskyy/Preferences@^2.1.0
	sparkfun/SparkFun LSM6DS3 Breakout@^1.0.3
	adafruit/Adafruit VL53L1X@^3.1.2
